[project]
name = "lol-match-predictor"
version = "0.1.0"
description = "Pro LoL match outcome prediction — DraftTransformer + Match Graph GNN"
requires-python = ">=3.11,<3.14"   # cap prevents uv resolving for unreleased Pythons

dependencies = [
    # Core ML — torch pulled from PyTorch's CUDA 12.4 index (see [tool.uv.sources])
    # torch-scatter / torch-sparse not needed: PyG 2.5+ uses PyTorch built-in scatter
    "torch==2.5.1",
    "torch-geometric>=2.6.0",
    # Data
    "pandas>=2.1",
    "pyarrow>=14.0",
    "numpy>=1.26",
    # Models / eval
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "tabpfn>=2.0",
    "scipy>=1.12",
    # Visualisation
    "matplotlib>=3.8",
    # Utilities
    "tqdm>=4.66",
    "riotwatcher>=3.3",
    "gdown>=5.1",
    # Dashboard
    "streamlit>=1.35",
    "shap>=0.45",
    "plotly>=5.20",
    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

# ── uv index configuration ─────────────────────────────────────────────────
# Only torch uses a custom index. Everything else resolves from PyPI.
# To upgrade torch: bump the version above AND the cu* suffix here.
# ──────────────────────────────────────────────────────────────────────────

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name     = "pytorch-cu124"
url      = "https://download.pytorch.org/whl/cu124"
explicit = true

# ── dev tools ─────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1",
]
